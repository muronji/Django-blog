{% extends "blog/base.html" %}

{% block content %}
        <article class="media content-section">
            <img class="rounded-circle article-img" src="{{ post.author.profile.image.url }}">
            <div class="media-body">
                <!-- Flex container for author/date + buttons -->
                <div class="d-flex justify-content-between align-items-center article-metadata">
                    <div>
                        <a class="mr-2" href="#">{{ object.author }}</a>
                        <small class="text-muted">{{ object.date_posted|date:"F d, Y" }}</small>
                    </div>

                    {% if user == object.author %}
                    <div>
                        <a class="btn btn-secondary btn-sm mr-2" href="{% url 'post-update' object.pk %}">Update</a>
                        <a class="btn btn-danger btn-sm" href="{% url 'post-delete' object.pk %}">Delete</a>
                    </div>
                    {% endif %}
                </div>

                <h2 class="article-title">{{ object.title }}</h2>
                <p class="article-content">{{ object.content }}</p>
            </div>
        </article>


{% endblock %}
